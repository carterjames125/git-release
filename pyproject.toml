[project]
name = "git-release"
version = "0.1.0"
description = "GitLab CI release automation: tag, upload, changelog, notify"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich-click>=1.8",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "python-gitlab>=4.0",
    "jinja2>=3.1",
]

[project.scripts]
gitlab-release = "gitlab_release.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_release"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "gitlab.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
]
